# RailFood Nginx Reverse Proxy Configuration
# Optimized for AWS EC2 Free Tier (Single Host: React Frontend + FastAPI Backend)

server {
    listen 80;
    listen [::]:80;
    server_name _; # Catch-all for EC2 Public IP or configure your domain name

    # Logging
    access_log /var/log/nginx/railfood_access.log;
    error_log /var/log/nginx/railfood_error.log warn;

    # Maximum file upload size (allows high-res food dish photos and vendor FSSAI PDF certificates)
    client_max_body_size 25M;

    # Gzip Compression to minimize Free Tier data transfer costs and optimize 3G/4G train passenger connectivity
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend: Serve React production build from /var/www/railfood
    root /var/www/railfood;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static frontend assets for 30 days
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 2. Backend API: Reverse proxy /api requests to FastAPI Uvicorn on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # Connection & buffering settings
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for ReportLab PDF invoice generation and S3 uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 3. Interactive FastAPI Swagger Docs & OpenAPI schema
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
